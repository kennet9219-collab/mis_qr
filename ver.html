<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Imagen</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            background-color: #f4f7f6; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        .viewer-box { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); 
            max-width: 500px; 
            width: 100%;
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            box-sizing: border-box;
        }
        .viewer-box img.main-img { 
            max-width: 100%; 
            max-height: 65vh; 
            border-radius: 8px; 
            object-fit: contain; 
        }
        /* Estilos base para el botón de texto clásico */
        .action-btn { 
            display: none; 
            color: white; 
            text-decoration: none; 
            padding: 16px 24px; 
            font-size: 16px; 
            font-weight: 600; 
            margin-top: 25px; 
            width: 100%; 
            box-sizing: border-box; 
            transition: all 0.25s ease; 
            letter-spacing: 0.5px;
        }
        .action-btn:hover { 
            opacity: 0.9;
            transform: translateY(-1px); 
        }
        /* Estilos para cuando el botón es una imagen */
        .img-btn {
            display: none;
            margin-top: 25px;
            width: 100%;
            text-decoration: none;
            transition: all 0.25s ease;
        }
        .img-btn img {
            width: 100%;
            max-height: 80px; /* Ajusta la altura máxima de tu banner botón */
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .img-btn:hover {
            transform: scale(1.02);
            opacity: 0.95;
        }
        #errorMsg { 
            color: #e74c3c; 
            font-weight: bold; 
            display: none; 
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="viewer-box">
    <div id="errorMsg">❌ No se encontró la información o imagen solicitada.</div>
    <img id="mainImage" class="main-img" src="" alt="Cargando..." style="display: none;">
    
    <!-- Opción 1: Botón de texto clásico -->
    <a id="redirectBtn" class="action-btn" href="#" target="_blank">🔗 Ver más información</a>
    
    <!-- Opción 2: Botón de imagen/banner personalizado -->
    <a id="redirectImgBtn" class="img-btn" href="#" target="_blank">
        <img id="btnImageSrc" src="" alt="Botón">
    </a>
</div>

<script>
    async function initViewer() {
        const urlParams = new URLSearchParams(window.location.search);
        const fotoName = urlParams.get('foto');
        
        const errorMsg = document.getElementById('errorMsg');
        const mainImage = document.getElementById('mainImage');
        const redirectBtn = document.getElementById('redirectBtn');
        const redirectImgBtn = document.getElementById('redirectImgBtn');
        const btnImageSrc = document.getElementById('btnImageSrc');

        if (!fotoName) {
            errorMsg.style.display = 'block';
            return;
        }

        const repoPath = window.location.pathname.replace('ver.html', '');
        const baseUrl = `${window.location.protocol}//${window.location.host}${repoPath}`;

        try {
            const response = await fetch('config.json?v=' + new Date().getTime());
            const config = await response.json();
            
            if (config[fotoName]) {
                const datosFoto = config[fotoName];
                
                mainImage.src = baseUrl + datosFoto.archivo;
                mainImage.style.display = 'block';
                
                // Si el usuario configuró una dirección de destino
                if (datosFoto.destino && datosFoto.destino.trim() !== "") {
                    
                    // ¿Configuró una IMAGEN como botón?
                    if (datosFoto.imagen_boton && datosFoto.imagen_boton.trim() !== "") {
                        redirectImgBtn.href = datosFoto.destino;
                        btnImageSrc.src = baseUrl + datosFoto.imagen_boton;
                        redirectImgBtn.style.display = 'block'; // Mostramos el botón imagen
                    } else {
                        // Si no hay imagen, usamos el botón de texto tradicional
                        redirectBtn.href = datosFoto.destino;
                        
                        if (datosFoto.texto && datosFoto.texto.trim() !== "") {
                            redirectBtn.innerHTML = datosFoto.texto;
                        }
                        if (datosFoto.estilo && datosFoto.estilo.trim() !== "") {
                            redirectBtn.style.cssText = datosFoto.estilo;
                        } else {
                            redirectBtn.style.cssText = "background-color: #2563eb; border-radius: 50px;";
                        }
                        redirectBtn.style.display = 'block'; // Mostramos el botón texto
                    }
                }
            } else {
                errorMsg.style.display = 'block';
            }
        } catch (e) {
            errorMsg.style.display = 'block';
            console.error(e);
        }
    }

    window.onload = initViewer;
</script>

</body>
</html>
