<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Imagen</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            background-color: #f4f7f6; 
            background-position: center center; 
            background-repeat: no-repeat; 
            background-size: 100% 100%; 
            background-attachment: fixed;
            padding: 20px; 
            box-sizing: border-box; 
            transition: background 0.3s ease;
        }
        .viewer-box { 
            background: transparent; 
            padding: 0; 
            border-radius: 0; 
            box-shadow: none; 
            max-width: 500px; 
            width: 100%;
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            box-sizing: border-box;
        }
        .viewer-box img.main-img { 
            max-width: 100%; 
            max-height: 65vh; 
            border-radius: 8px; 
            object-fit: contain; 
        }
        .action-btn { 
            display: none; 
            color: white; 
            text-decoration: none; 
            padding: 16px 24px; 
            font-size: 16px; 
            font-weight: 600; 
            margin-top: 25px; 
            width: 100%; 
            box-sizing: border-box; 
            transition: all 0.25s ease; 
            letter-spacing: 0.5px;
        }
        .action-btn:hover { 
            opacity: 0.9;
            transform: translateY(-1px); 
        }
        /* Estilos base para el botón de imagen (El tamaño y el fondo se le darán desde el config.json) */
        .img-btn {
            display: none;
            margin-top: 25px;
            text-decoration: none;
            transition: all 0.25s ease;
            background: transparent !important;
            border: none !important;
            padding: 0 !important;
            box-shadow: none !important;
        }
        .img-btn img {
            width: 100%;
            height: auto;
            max-height: 100px; 
            object-fit: contain;
            box-sizing: border-box;
            transition: all 0.25s ease;
        }
        .img-btn:hover {
            transform: scale(1.05); 
            opacity: 0.95;
        }
        #errorMsg { 
            color: #e74c3c; 
            font-weight: bold; 
            display: none; 
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container viewer-box">
    <div id="errorMsg">❌ No se encontró la información o imagen solicitada.</div>
    <img id="mainImage" class="main-img" src="" alt="Cargando..." style="display: none;">
    
    <a id="redirectBtn" class="action-btn" href="#" target="_blank">🔗 Ver más información</a>
    
    <a id="redirectImgBtn" class="img-btn" href="#" target="_blank">
        <img id="btnImageSrc" src="" alt="Botón">
    </a>
</div>

<script>
    async function initViewer() {
        const urlParams = new URLSearchParams(window.location.search);
        const fotoName = urlParams.get('foto');
        
        const errorMsg = document.getElementById('errorMsg');
        const mainImage = document.getElementById('mainImage');
        const redirectBtn = document.getElementById('redirectBtn');
        const redirectImgBtn = document.getElementById('redirectImgBtn');
        const btnImageSrc = document.getElementById('btnImageSrc');

        if (!fotoName) {
            errorMsg.style.display = 'block';
            return;
        }

        const repoPath = window.location.pathname.replace('ver.html', '');
        const baseUrl = `${window.location.protocol}//${window.location.host}${repoPath}`;

        try {
            const response = await fetch('config.json?v=' + new Date().getTime());
            const config = await response.json();
            
            if (config[fotoName]) {
                const datosFoto = config[fotoName];
                
                mainImage.src = baseUrl + datosFoto.archivo;
                mainImage.style.display = 'block';
                
                if (datosFoto.fondo && datosFoto.fondo.trim() !== "") {
                    if (datosFoto.fondo.includes('.') || datosFoto.fondo.startsWith('http')) {
                        const fondoUrl = datosFoto.fondo.startsWith('http') ? datosFoto.fondo : baseUrl + datosFoto.fondo;
                        document.body.style.backgroundImage = `url('${fondoUrl}')`;
                        document.body.style.backgroundSize = "100% 100%";
                    } else {
                        document.body.style.background = datosFoto.fondo;
                    }
                }
                
                if (datosFoto.destino && datosFoto.destino.trim() !== "") {
                    if (datosFoto.imagen_boton && datosFoto.imagen_boton.trim() !== "") {
                        redirectImgBtn.href = datosFoto.destino;
                        btnImageSrc.src = baseUrl + datosFoto.imagen_boton;
                        
                        // 🧠 ASIGNACIÓN DINÁMICA: Aplicamos las instrucciones de estilo del config.json directamente aquí
                        if (datosFoto.estilo && datosFoto.estilo.trim() !== "") {
                            // Separamos las propiedades: el ancho va al contenedor, el fondo va a la imagen interna
                            const estilos = datosFoto.estilo.split(';');
                            estilos.forEach(estilo => {
                                if (estilo.includes('width')) {
                                    redirectImgBtn.style.cssText += estilo + ';';
                                } else {
                                    btnImageSrc.style.cssText += estilo + ';';
                                }
                            });
                        } else {
                            // Estilo por defecto si se te olvida configurarlo en el JSON
                            redirectImgBtn.style.width = "50%";
                            btnImageSrc.style.cssText = "background-color: #2563eb; border-radius: 50px; padding: 10px 15px;";
                        }
                        
                        redirectImgBtn.style.display = 'block';
                    } else {
                        redirectBtn.href = datosFoto.destino;
                        if (datosFoto.texto && datosFoto.texto.trim() !== "") {
                            redirectBtn.innerHTML = datosFoto.texto;
                        }
                        if (datosFoto.estilo && datosFoto.estilo.trim() !== "") {
                            redirectBtn.style.cssText = datosFoto.estilo;
                        } else {
                            redirectBtn.style.cssText = "background-color: #2563eb; border-radius: 50px;";
                        }
                        redirectBtn.style.display = 'block';
                    }
                }
            } else {
                errorMsg.style.display = 'block';
            }
        } catch (e) {
            errorMsg.style.display = 'block';
            console.error(e);
        }
    }

    window.onload = initViewer;
</script>

</body>
</html>
