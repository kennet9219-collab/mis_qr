<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Imagen</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            background-color: #f4f7f6; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        .viewer-box { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); 
            max-width: 500px; 
            width: 100%;
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            box-sizing: border-box;
        }
        .viewer-box img { 
            max-width: 100%; 
            max-height: 65vh; 
            border-radius: 8px; 
            object-fit: contain; 
        }
        /* Estilos base compartidos por todos los botones */
        .action-btn { 
            display: none; 
            color: white; 
            text-decoration: none; 
            padding: 16px 24px; 
            font-size: 16px; 
            font-weight: 600; 
            margin-top: 25px; 
            width: 100%; 
            box-sizing: border-box; 
            transition: all 0.25s ease; 
            letter-spacing: 0.5px;
        }
        .action-btn:hover { 
            opacity: 0.9;
            transform: translateY(-1px); 
        }
        #errorMsg { 
            color: #e74c3c; 
            font-weight: bold; 
            display: none; 
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="viewer-box">
    <div id="errorMsg">❌ No se encontró la información o imagen solicitada.</div>
    <img id="mainImage" src="" alt="Cargando..." style="display: none;">
    <a id="redirectBtn" class="action-btn" href="#" target="_blank">🔗 Ver más información</a>
</div>

<script>
    async function initViewer() {
        const urlParams = new URLSearchParams(window.location.search);
        const fotoName = urlParams.get('foto');
        
        const errorMsg = document.getElementById('errorMsg');
        const mainImage = document.getElementById('mainImage');
        const redirectBtn = document.getElementById('redirectBtn');

        if (!fotoName) {
            errorMsg.style.display = 'block';
            return;
        }

        const repoPath = window.location.pathname.replace('ver.html', '');
        const baseUrl = `${window.location.protocol}//${window.location.host}${repoPath}`;

        try {
            const response = await fetch('config.json?v=' + new Date().getTime());
            const config = await response.json();
            
            if (config[fotoName]) {
                const datosFoto = config[fotoName];
                
                mainImage.src = baseUrl + datosFoto.archivo;
                mainImage.style.display = 'block';
                
                if (datosFoto.destino && datosFoto.destino.trim() !== "") {
                    redirectBtn.href = datosFoto.destino;
                    
                    // Aplicamos el texto personalizado
                    if (datosFoto.texto && datosFoto.texto.trim() !== "") {
                        redirectBtn.innerHTML = datosFoto.texto;
                    }

                    // ¡MAGIA! Aplicamos el aspecto e instrucciones físicas personalizadas desde el JSON
                    if (datosFoto.estilo && datosFoto.estilo.trim() !== "") {
                        redirectBtn.style.cssText = datosFoto.estilo;
                    } else {
                        // Estilo por defecto si se te olvida poner uno en el JSON
                        redirectBtn.style.cssText = "background-color: #2563eb; border-radius: 50px;";
                    }
                    
                    redirectBtn.style.display = 'block';
                }
            } else {
                errorMsg.style.display = 'block';
            }
        } catch (e) {
            errorMsg.style.display = 'block';
            console.error(e);
        }
    }

    window.onload = initViewer;
</script>

</body>
</html>
